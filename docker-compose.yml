# ── Rammy HR Chatbot — Docker Compose ────────────────────────────────────────
# Starts both the Python backend and Node.js server together.
#
# Usage:
#   docker-compose up --build      ← first time or after code changes
#   docker-compose up              ← subsequent runs
#   docker-compose down            ← shut everything down


services:

  # ── Python Flask Backend ───────────────────────────────────────────────────
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: rammy-python
    env_file:
      - .env                        # Loads your OPENAI_API_KEY securely
    environment:
      - FLASK_ENV=production
    ports:
      - "5001:5001"                 # Expose for local testing only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  # ── Node.js Express Server ─────────────────────────────────────────────────
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: rammy-node
    environment:
      - PORT=3000
      - PYTHON_BASE_URL=http://python:5001   # Uses Docker's internal network
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    ports:
      - "3000:3000"                 # Exposed to the browser
    depends_on:
      python:
        condition: service_healthy  # Waits for Python to pass health check
    restart: unless-stopped

networks:
  default:
    name: rammy-network
