<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="580" fill="#ffffff"/>

  <!-- User / Browser -->
  <rect x="240" y="30" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="56" text-anchor="middle" fill="#1f2937">Browser</text>
  <text font-family="sans-serif" font-size="12" x="340" y="74" text-anchor="middle" fill="#6b7280">index.html + chat.js</text>

  <!-- Arrow: Browser -> Node -->
  <line x1="340" y1="86" x2="340" y2="148" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="356" y="122" fill="#6b7280">POST /api/chat</text>

  <!-- Docker dashed outline -->
  <rect x="30" y="130" width="580" height="210" rx="14" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
  <text font-family="sans-serif" font-size="12" x="46" y="152" fill="#6b7280">Docker</text>
  <text font-family="sans-serif" font-size="12" x="46" y="185" fill="#6b7280">:3000</text>
  <text font-family="sans-serif" font-size="12" x="46" y="305" fill="#6b7280">:5001</text>

  <!-- Node.js Express -->
  <rect x="180" y="148" width="320" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="172" text-anchor="middle" fill="#085041">Node.js Express</text>
  <text font-family="sans-serif" font-size="12" x="340" y="190" text-anchor="middle" fill="#0f6e56">Rate limiting · CORS · validation</text>

  <!-- Arrow: Node -> Python -->
  <line x1="340" y1="204" x2="340" y2="266" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="356" y="240" fill="#6b7280">POST /chat</text>

  <!-- Python Flask -->
  <rect x="140" y="266" width="300" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="290" y="290" text-anchor="middle" fill="#26215c">Python Flask</text>
  <text font-family="sans-serif" font-size="12" x="290" y="308" text-anchor="middle" fill="#534ab7">PII detection · retrieval · prompt builder</text>

  <!-- HR Sources -->
  <rect x="460" y="255" width="170" height="110" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="545" y="280" text-anchor="middle" fill="#042c53">HR Sources</text>
  <text font-family="sans-serif" font-size="12" x="545" y="300" text-anchor="middle" fill="#185fa5">wcupa.edu/hr</text>
  <text font-family="sans-serif" font-size="12" x="545" y="318" text-anchor="middle" fill="#185fa5">passhe.edu/hr</text>
  <text font-family="sans-serif" font-size="12" x="545" y="336" text-anchor="middle" fill="#185fa5">uscis.gov</text>

  <!-- Arrow: HR Sources -> Python -->
  <line x1="460" y1="305" x2="442" y2="305" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Python -> OpenAI -->
  <line x1="290" y1="322" x2="290" y2="384" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="306" y="358" fill="#6b7280">chat.completions.create</text>

  <!-- OpenAI -->
  <rect x="170" y="384" width="240" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="290" y="408" text-anchor="middle" fill="#412402">OpenAI API</text>
  <text font-family="sans-serif" font-size="12" x="290" y="426" text-anchor="middle" fill="#854f0b">gpt-4.1-mini</text>

  <!-- Legend -->
  <rect x="40" y="490" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="60" y="502" fill="#374151">Frontend</text>

  <rect x="130" y="490" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="150" y="502" fill="#374151">Node server</text>

  <rect x="240" y="490" width="14" height="14" rx="3" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="260" y="502" fill="#374151">Python backend</text>

  <rect x="375" y="490" width="14" height="14" rx="3" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="395" y="502" fill="#374151">OpenAI</text>

  <rect x="455" y="490" width="14" height="14" rx="3" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" x="475" y="502" fill="#374151">HR sources</text>
</svg>
