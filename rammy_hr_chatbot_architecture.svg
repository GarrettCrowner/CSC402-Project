<svg width="100%" viewBox="0 0 680 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- User -->
  <g class="node c-gray" onclick="sendPrompt('Tell me more about the Rammy frontend')">
    <rect x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Browser</text>
    <text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">index.html + chat.js</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="86" x2="340" y2="148" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="122" dominant-baseline="central">POST /api/chat</text>

  <!-- Node.js -->
  <g class="node c-teal" onclick="sendPrompt('Tell me more about the Node.js Express server')">
    <rect x="180" y="148" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central">Node.js Express</text>
    <text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">Rate limiting · CORS · validation</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="204" x2="340" y2="266" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="240" dominant-baseline="central">POST /chat</text>

  <!-- Python Flask -->
  <g class="node c-purple" onclick="sendPrompt('Tell me more about the Python Flask backend')">
    <rect x="140" y="266" width="400" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">Python Flask</text>
    <text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central">PII detection · retrieval · prompt builder</text>
  </g>

  <!-- Arrow down -->
  <line x1="340" y1="322" x2="340" y2="384" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="358" dominant-baseline="central">chat.completions.create</text>

  <!-- OpenAI -->
  <g class="node c-amber" onclick="sendPrompt('Tell me more about the OpenAI GPT-4.1-mini model')">
    <rect x="200" y="384" width="280" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">OpenAI API</text>
    <text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">gpt-4.1-mini</text>
  </g>

  <!-- HR Sources box -->
  <g class="node c-blue" onclick="sendPrompt('What HR sources does Rammy use?')">
    <rect x="460" y="266" width="180" height="100" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="294" text-anchor="middle" dominant-baseline="central">HR Sources</text>
    <text class="ts" x="550" y="314" text-anchor="middle" dominant-baseline="central">wcupa.edu/hr</text>
    <text class="ts" x="550" y="332" text-anchor="middle" dominant-baseline="central">passhe.edu/hr</text>
    <text class="ts" x="550" y="350" text-anchor="middle" dominant-baseline="central">uscis.gov</text>
  </g>

  <!-- Arrow from HR sources to Python -->
  <line x1="460" y1="305" x2="542" y2="305" class="arr" marker-end="url(#arrow)" transform="rotate(180, 501, 305)"/>

  <!-- Docker container dashed outline -->
  <rect x="30" y="130" width="580" height="210" rx="14" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="46" y="152" dominant-baseline="central">Docker</text>

  <!-- Port labels -->
  <text class="ts" x="46" y="185" dominant-baseline="central">:3000</text>
  <text class="ts" x="46" y="305" dominant-baseline="central">:5001</text>

  <!-- Legend -->
  <g class="c-gray"><rect x="40" y="520" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts" x="60" y="531" dominant-baseline="central">Frontend</text>
  <g class="c-teal"><rect x="130" y="520" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts" x="150" y="531" dominant-baseline="central">Node server</text>
  <g class="c-purple"><rect x="240" y="520" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts" x="260" y="531" dominant-baseline="central">Python backend</text>
  <g class="c-amber"><rect x="370" y="520" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts" x="390" y="531" dominant-baseline="central">OpenAI</text>
  <g class="c-blue"><rect x="450" y="520" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="ts" x="470" y="531" dominant-baseline="central">HR sources</text>
</svg>